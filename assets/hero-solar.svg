<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Blue-hour solar farm with rows of panels under a glowing sky">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020a1a"/>
      <stop offset=".36" stop-color="#061b3d"/>
      <stop offset=".66" stop-color="#0b3a7a"/>
      <stop offset=".85" stop-color="#1b6fc4"/>
      <stop offset="1" stop-color="#59c6ff"/>
    </linearGradient>
    <radialGradient id="h-moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d7f8ff" stop-opacity=".95"/>
      <stop offset=".32" stop-color="#8fe8ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8fe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071a39"/>
      <stop offset="1" stop-color="#020a1a"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d86ff"/>
      <stop offset=".4" stop-color="#0b3a86"/>
      <stop offset=".76" stop-color="#082a60"/>
      <stop offset="1" stop-color="#1466e8"/>
    </linearGradient>
    <pattern id="h-cells" width="56" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 0h56v42H0z" fill="none" stroke="#8fe8ff" stroke-opacity=".22" stroke-width="2"/>
      <path d="M28 0v42M0 21h56" stroke="#8fe8ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="h-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7ff" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#dff7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="h-floor-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2d86ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2d86ff" stop-opacity="0"/>
    </radialGradient>
    <g id="h-unit">
      <rect x="-260" y="-120" width="520" height="240" rx="10" fill="#05122b"/>
      <rect x="-246" y="-106" width="492" height="212" rx="6" fill="url(#h-glass)"/>
      <rect x="-246" y="-106" width="492" height="212" rx="6" fill="url(#h-cells)"/>
      <path d="M-246-106H-64L-246 106Z" fill="url(#h-glare)"/>
      <rect x="-260" y="-120" width="520" height="240" rx="10" fill="none" stroke="#4aa8ff" stroke-opacity=".5" stroke-width="4"/>
      <rect x="-196" y="120" width="12" height="64" fill="#04122a"/>
      <rect x="184" y="120" width="12" height="64" fill="#04122a"/>
    </g>
  </defs>

  <rect width="2200" height="1200" fill="url(#h-sky)"/>

  <g fill="#e6fbff">
    <circle cx="190" cy="140" r="2" opacity=".7"/>
    <circle cx="330" cy="92" r="1.4" opacity=".55"/>
    <circle cx="500" cy="190" r="2.2" opacity=".6"/>
    <circle cx="680" cy="100" r="1.5" opacity=".45"/>
    <circle cx="820" cy="230" r="1.8" opacity=".55"/>
    <circle cx="980" cy="120" r="1.3" opacity=".4"/>
    <circle cx="1130" cy="200" r="2" opacity=".5"/>
    <circle cx="1290" cy="90" r="1.6" opacity=".5"/>
    <circle cx="1440" cy="240" r="1.4" opacity=".45"/>
    <circle cx="1910" cy="120" r="2" opacity=".55"/>
    <circle cx="2050" cy="220" r="1.6" opacity=".45"/>
    <circle cx="2360" cy="160" r="1.8" opacity=".4"/>
  </g>

  <circle cx="1710" cy="270" r="340" fill="url(#h-moon)"/>
  <circle cx="1710" cy="270" r="54" fill="#e6fbff" opacity=".95"/>

  <ellipse cx="1120" cy="830" rx="1350" ry="310" fill="url(#h-horizon)"/>

  <path d="M0 790 180 706 340 766 520 684 720 772 900 720 1080 792 1260 728 1450 788 1650 716 1840 780 2020 708 2200 782V920H0Z" fill="#04122a"/>
  <rect y="828" width="2200" height="372" fill="url(#h-ground)"/>

  <g fill="#5cc8ff" opacity=".5">
    <rect x="120" y="806" width="5" height="9"/>
    <rect x="138" y="800" width="4" height="15"/>
    <rect x="170" y="808" width="6" height="8"/>
    <rect x="196" y="802" width="4" height="13"/>
    <rect x="1180" y="804" width="5" height="10"/>
    <rect x="1202" y="798" width="4" height="16"/>
    <rect x="1240" y="806" width="6" height="8"/>
  </g>

  <ellipse cx="1450" cy="1080" rx="700" ry="140" fill="url(#h-floor-glow)"/>

  <g transform="translate(320 948) rotate(-2) scale(.52)" opacity=".5"><use href="#h-unit"/></g>
  <g transform="translate(720 1012) rotate(-3) scale(.9)" opacity=".8"><use href="#h-unit"/></g>
  <g transform="translate(1460 900) rotate(-5) scale(1.16)"><use href="#h-unit"/></g>
  <g transform="translate(1970 1016) rotate(-7) scale(.78)" opacity=".72"><use href="#h-unit"/></g>

  <g opacity=".38" fill="#8fe8ff">
    <rect x="1104" y="1044" width="720" height="3" rx="1.5"/>
    <rect x="1178" y="1082" width="580" height="2" rx="1"/>
    <rect x="560" y="1100" width="360" height="2" rx="1"/>
  </g>
</svg>
