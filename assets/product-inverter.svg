<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Hybrid solar inverter with glowing blue display">
  <defs>
    <radialGradient id="pi-bg" cx=".5" cy=".12" r=".95">
      <stop offset="0" stop-color="#1a5fc0"/>
      <stop offset=".45" stop-color="#092b63"/>
      <stop offset="1" stop-color="#030f25"/>
    </radialGradient>
    <linearGradient id="pi-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1e3f"/>
      <stop offset=".28" stop-color="#123a78"/>
      <stop offset=".62" stop-color="#0c2a5c"/>
