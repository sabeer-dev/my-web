<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Monocrystalline solar panel illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2e8"/>
      <stop offset="1" stop-color="#dde5c8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6b58"/>
      <stop offset="0.45" stop-color="#1d3f33"/>
      <stop offset="1" stop-color="#2a5443"/>
    </linearGradient>
    <pattern id="cells" width="88" height="108" patternUnits="userSpaceOnUse">
      <rect width="88" height="108" fill="none" stroke="#5c8474" stroke-width="3"/>
    </pattern>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="648" cy="168" r="96" fill="#e6d58c" opacity=".5"/>
  <circle cx="648" cy="168" r="62" fill="#eddf9f" opacity=".65"/>
  <g transform="translate(400 430) rotate(-10)">
    <rect x="-292" y="-196" width="584" height="392" rx="12" fill="#24483c"/>
    <rect x="-272" y="-176" width="544" height="352" rx="6" fill="url(#glass)"/>
    <rect x="-272" y="-176" width="544" height="352" rx="6" fill="url(#cells)"/>
    <rect x="-272" y="-176" width="544" height="352" rx="6" fill="url(#glare)"/>
    <rect x="-292" y="-196" width="584" height="392" rx="12" fill="none" stroke="#16302a" stroke-width="5"/>
  </g>
  <g fill="#b9c3a9">
    <rect x="236" y="700" width="16" height="62" rx="4"/>
    <rect x="552" y="700" width="16" height="62" rx="4"/>
  </g>
  <rect y="756" width="800" height="44" fill="#d8d5c2"/>
</svg>
