<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Solar LED floodlight casting a blue-white beam">
  <defs>
    <radialGradient id="pl-bg" cx=".5" cy=".12" r=".95">
      <stop offset="0" stop-color="#1758b4"/>
      <stop offset=".46" stop-color="#082a60"/>
      <stop offset="1" stop-color="#031025"/>
    </radialGradient>
    <linearGradient id="pl-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7f8ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pl-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a78"/>
      <stop offset=".55" stop-color="#0a2350"/>
      <stop offset="1" stop-color="#06152f"/>
    </linearGradient>
    <linearGradient id="pl-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset=".5" stop-color="#0b3a86"/>
      <stop offset="1" stop-color="#082a60"/>
    </linearGradient>
    <filter id="pl-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020b1c" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#pl-bg)"/>
  <g fill="#c9f4ff">
    <circle cx="150" cy="180" r="2.3" opacity=".55"/>
    <circle cx="646" cy="120" r="1.9" opacity=".5"/>
    <circle cx="700" cy="420" r="1.6" opacity=".4"/>
    <circle cx="108" cy="430" r="1.5" opacity=".4"/>
  </g>

  <path d="M236 640 352 336l242 62-142 330z" fill="url(#pl-beam)" opacity=".8"/>

  <g filter="url(#pl-shadow)">
    <rect x="292" y="150" width="216" height="96" rx="12" fill="url(#pl-panel)" transform="rotate(-6 400 198)"/>
    <g stroke="#8fd6ff" stroke-opacity=".35" stroke-width="2" transform="rotate(-6 400 198)">
      <path d="M292 182h216M292 214h216M364 150v96M436 150v96"/>
    </g>

    <g transform="translate(334 306) rotate(-10)">
      <rect x="0" y="0" width="286" height="286" rx="28" fill="url(#pl-frame)"/>
      <rect x="0" y="0" width="286" height="286" rx="28" fill="none" stroke="#4aa8ff" stroke-opacity=".5" stroke-width="3"/>
      <rect x="24" y="24" width="238" height="238" rx="16" fill="#e8faff"/>
      <g fill="#8fe8ff">
        <circle cx="88" cy="88" r="25"/><circle cx="150" cy="88" r="25"/><circle cx="212" cy="88" r="25"/>
        <circle cx="88" cy="150" r="25"/><circle cx="150" cy="150" r="25"/><circle cx="212" cy="150" r="25"/>
        <circle cx="88" cy="212" r="25"/><circle cx="150" cy="212" r="25"/><circle cx="212" cy="212" r="25"/>
      </g>
      <g fill="#2d86ff" opacity=".55">
        <circle cx="88" cy="88" r="11"/><circle cx="150" cy="88" r="11"/><circle cx="212" cy="88" r="11"/>
        <circle cx="88" cy="150" r="11"/><circle cx="150" cy="150" r="11"/><circle cx="212" cy="150" r="11"/>
        <circle cx="88" cy="212" r="11"/><circle cx="150" cy="212" r="11"/><circle cx="212" cy="212" r="11"/>
      </g>
    </g>

    <g stroke="#4aa8ff" stroke-opacity=".5" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M548 468 650 610"/>
    </g>
