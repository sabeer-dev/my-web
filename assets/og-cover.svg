<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sabeer Market — know the price before you leave home">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04160f"/>
      <stop offset=".55" stop-color="#07251b"/>
      <stop offset="1" stop-color="#0b3326"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx=".16" cy=".14" r=".6">
      <stop offset="0" stop-color="#b9f36a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#b9f36a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx=".88" cy=".82" r=".55">
      <stop offset="0" stop-color="#f2a93b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad82"/>
      <stop offset=".5" stop-color="#e4572e"/>
      <stop offset="1" stop-color="#a82621"/>
    </linearGradient>
    <linearGradient id="onion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf0e0"/>
      <stop offset=".6" stop-color="#e4c7d2"/>
      <stop offset="1" stop-color="#b385b5"/>
    </linearGradient>
    <linearGradient id="pepper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".55" stop-color="#ed7739"/>
      <stop offset="1" stop-color="#b83324"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="170%" height="180%">
