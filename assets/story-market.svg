<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-label="A market planning flat lay with a basket of fresh produce, a phone showing food prices and a notebook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f0df"/>
      <stop offset=".55" stop-color="#eef2df"/>
      <stop offset="1" stop-color="#d7e7cf"/>
    </linearGradient>
    <radialGradient id="glow" cx=".58" cy=".35" r=".6">
      <stop offset="0" stop-color="#fffcf4"/>
      <stop offset="1" stop-color="#fffcf4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a96d"/>
      <stop offset=".4" stop-color="#c58d51"/>
      <stop offset="1" stop-color="#9a5f31"/>
    </linearGradient>
    <linearGradient id="tableLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3d8" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff3d8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6f3e1c" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a361"/>
      <stop offset="1" stop-color="#925b2c"/>
    </linearGradient>
    <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffae83"/>
      <stop offset=".45" stop-color="#ee6648"/>
      <stop offset="1" stop-color="#ad2a23"/>
    </linearGradient>
    <linearGradient id="pepper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".55" stop-color="#ed7739"/>
      <stop offset="1" stop-color="#b83324"/>
    </linearGradient>
    <linearGradient id="onion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcf1e2"/>
      <stop offset=".55" stop-color="#e5c8d3"/>
      <stop offset="1" stop-color="#b487b6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cefa86"/>
      <stop offset="1" stop-color="#167a4a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#eee3cd"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d2e"/>
      <stop offset="1" stop-color="#04160f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f5ea"/>
      <stop offset="1" stop-color="#e9f0df"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f77e"/>
      <stop offset="1" stop-color="#7cbf3b"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)"/>
  <rect width="1000" height="800" fill="url(#glow)"/>

  <g fill="#fffaf0" opacity=".55">
    <circle cx="120" cy="120" r="3"/><circle cx="200" cy="180" r="2"/><circle cx="820" cy="120" r="2.5"/>
    <circle cx="890" cy="200" r="2"/><circle cx="300" cy="90" r="2"/><circle cx="700" cy="140" r="3"/>
  </g>

  <g>
    <path d="M40 560h920v240H40z" fill="url(#table)"/>
    <path d="M40 560h920v240H40z" fill="url(#tableLight)"/>
    <path d="M40 560h920" stroke="#f4c98e" stroke-width="5" opacity=".55"/>
    <path d="M96 640h808M70 740h860" stroke="#7c4a25" stroke-width="3" opacity=".18"/>
  </g>

  <ellipse cx="380" cy="704" rx="260" ry="38" fill="#4b2a12" opacity=".28" filter="url(#soft)"/>

  <g>
    <path d="M164 492h352l-38 210H202l-38-210Z" fill="url(#basket)"/>
    <path d="M180 492h320l-20 34H200l-20-34Z" fill="#e6b779"/>
    <path d="M208 526c-10 44-16 88-18 132M264 526c-6 46-10 90-10 136M324 526c0 46 2 90 6 136M384 526c6 44 12 88 20 132M444 526c12 42 20 84 26 126" stroke="#70401f" stroke-width="7" opacity=".32"/>
    <g>
      <circle cx="238" cy="478" r="48" fill="url(#tomato)"/>
      <circle cx="314" cy="464" r="43" fill="url(#tomato)"/>
      <circle cx="386" cy="480" r="46" fill="url(#tomato)"/>
      <circle cx="456" cy="468" r="38" fill="url(#tomato)"/>
      <g stroke="#167a4a" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M238 430c10-20 28-22 38-4"/>
        <path d="M314 422c8-18 26-22 36-4"/>
        <path d="M386 434c10-20 28-22 38-4"/>
      </g>
      <ellipse cx="220" cy="458" rx="12" ry="7" fill="#fff" opacity=".28"/>
      <ellipse cx="370" cy="462" rx="12" ry="7" fill="#fff" opacity=".24"/>
    </g>
    <g>
      <ellipse cx="470" cy="512" rx="42" ry="48" fill="url(#onion)"/>
      <path d="M470 464c-4-26 4-42 18-48" stroke="#167a4a" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <g>
    <path d="M604 330c-18-30-4-64 28-70 34-8 58 18 50 50-8 34-52 48-78 20Z" fill="url(#pepper)" opacity=".9"/>
    <path d="M692 372c-14-26 0-54 26-58 28-4 46 20 38 46-8 28-44 38-64 12Z" fill="url(#pepper)" opacity=".75"/>
    <g stroke="#167a4a" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M626 262c8-16 24-20 36-10"/>
      <path d="M712 316c8-14 22-18 32-10"/>
    </g>
  </g>

  <g>
    <ellipse cx="718" cy="660" rx="150" ry="30" fill="#4b2a12" opacity=".22" filter="url(#soft)"/>
    <rect x="564" y="376" width="280" height="300" rx="34" fill="url(#phone)" transform="rotate(7 704 526)"/>
    <rect x="580" y="392" width="248" height="268" rx="24" fill="url(#screen)" transform="rotate(7 704 526)"/>
    <g transform="rotate(7 704 526)">
      <rect x="600" y="312" width="208" height="48" rx="10" fill="#fbf7ec" opacity=".92"/>
      <text x="620" y="343" font-family="DM Sans, sans-serif" font-size="15" font-weight="700" fill="#10261d">Today's market</text>
      <circle cx="780" cy="336" r="5" fill="#1fa564"/>
      <text x="606" y="390" font-family="DM Sans, sans-serif" font-size="11" font-weight="600" fill="#5d7369">TOMATOES · LAGOS</text>
      <text x="606" y="422" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600" fill="#07251b">₦32,000</text>
      <rect x="762" y="394" width="44" height="22" rx="11" fill="#fde8e4"/>
      <text x="784" y="409" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#b23a48">↑ 8.6%</text>
      <path d="M606 470c18-14 30-4 44-16 16-14 26-2 42-16 18-16 28 0 44-12 14-10 24-8 40-18" stroke="#167a4a" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M606 470c18-14 30-4 44-16 16-14 26-2 42-16 18-16 28 0 44-12 14-10 24-8 40-18V486H606Z" fill="#b9f36a" opacity=".22"/>
      <circle cx="776" cy="436" r="5" fill="#167a4a"/>
      <rect x="606" y="506" width="196" height="1" fill="#dbe7dd"/>
      <g font-family="DM Sans, sans-serif" fill="#10261d">
        <text x="606" y="534" font-size="11" font-weight="600">Rice · 50kg</text>
        <text x="802" y="534" text-anchor="end" font-size="11" font-weight="700">₦78,000</text>
        <text x="606" y="558" font-size="11" font-weight="600">Beans · 50kg</text>
        <text x="802" y="558" text-anchor="end" font-size="11" font-weight="700">₦65,000</text>
        <text x="606" y="582" font-size="11" font-weight="600">Eggs · crate</text>
        <text x="802" y="582" text-anchor="end" font-size="11" font-weight="700">₦5,200</text>
      </g>
      <rect x="606" y="600" width="196" height="34" rx="10" fill="#07251b"/>
      <text x="704" y="622" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#b9f36a">View all prices</text>
    </g>
  </g>

  <g transform="rotate(-8 814 700)">
    <rect x="700" y="610" width="250" height="170" rx="8" fill="url(#paper)"/>
    <path d="M726 650h176M726 676h150M726 702h164M726 728h120" stroke="#9aab99" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <circle cx="728" cy="644" r="5" fill="#167a4a"/>
    <circle cx="728" cy="670" r="5" fill="#167a4a" opacity=".7"/>
    <circle cx="728" cy="696" r="5" fill="#167a4a" opacity=".45"/>
    <path d="M884 610l54-14-14 54-54 14 14-54Z" fill="#f2a93b" opacity=".8"/>
  </g>

  <g>
    <path d="M140 724c26-58 70-84 118-72-12 52-54 84-118 72Z" fill="url(#leaf)" opacity=".9"/>
    <path d="M162 712c26-26 54-42 82-50" stroke="#07251b" stroke-width="4" stroke-linecap="round" opacity=".35" fill="none"/>
    <path d="M900 548c-8-44-38-68-78-62 4 42 34 70 78 62Z" fill="url(#leaf)" opacity=".7"/>
  </g>

  <g fill="#f2a93b" opacity=".55">
    <circle cx="560" cy="740" r="3"/><circle cx="588" cy="762" r="2"/><circle cx="530" cy="770" r="2.5"/>
    <circle cx="612" cy="728" r="2"/><circle cx="900" cy="760" r="2.5"/>
  </g>
</svg>
