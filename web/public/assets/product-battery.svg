      <rect x="300" y="254" width="176" height="9" rx="4.5" opacity=".55"/>
      <rect x="300" y="274" width="142" height="9" rx="4.5" opacity=".4"/>
      <rect x="300" y="298" width="84" height="8" rx="4" opacity=".3"/>
    </g>
    <text x="500" y="238" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#0b3a86" text-anchor="end">200Ah</text>

    <g>
