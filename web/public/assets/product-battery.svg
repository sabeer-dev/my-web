      <rect x="296" y="490" width="118" height="26" rx="6" fill="url(#pb-bar)" opacity=".65"/>
      <rect x="290" y="542" width="220" height="38" rx="10" fill="#061a38"/>
      <rect x="296" y="548" width="72" height="26" rx="6" fill="url(#pb-bar)" opacity=".4"/>
