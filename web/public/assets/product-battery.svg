<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Deep-cycle solar battery with blue energy bars">
  <defs>
    <radialGradient id="pb-bg" cx=".5" cy=".14" r=".95">
      <stop offset="0" stop-color="#1a5fc0"/>
      <stop offset=".45" stop-color="#082a60"/>
      <stop offset="1" stop-color="#031025"/>
    </radialGradient>
    <linearGradient id="pb-case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1e3f"/>
      <stop offset=".3" stop-color="#123e80"/>
      <stop offset=".65" stop-color="#0c2a5c"/>
      <stop offset="1" stop-color="#05142e"/>
    </linearGradient>
    <linearGradient id="pb-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe8ff"/>
      <stop offset="1" stop-color="#2d86ff"/>
    </linearGradient>
    <linearGradient id="pb-label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8faff"/>
      <stop offset="1" stop-color="#b9e6ff"/>
    </linearGradient>
    <radialGradient id="pb-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pb-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020b1c" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#pb-bg)"/>
  <circle cx="600" cy="190" r="250" fill="url(#pb-glow)"/>
  <g fill="#c9f4ff">
    <circle cx="146" cy="160" r="2.4" opacity=".6"/>
    <circle cx="236" cy="104" r="1.6" opacity=".45"/>
    <circle cx="674" cy="380" r="2" opacity=".5"/>
    <circle cx="124" cy="432" r="1.6" opacity=".4"/>
    <circle cx="686" cy="96" r="1.5" opacity=".45"/>
  </g>
  <ellipse cx="400" cy="706" rx="230" ry="34" fill="#020b1c" opacity=".6"/>

  <g filter="url(#pb-shadow)">
    <rect x="284" y="116" width="70" height="46" rx="10" fill="#2d86ff"/>
    <rect x="446" y="116" width="70" height="46" rx="10" fill="#0c2a5c" stroke="#4aa8ff" stroke-opacity=".5" stroke-width="2"/>
    <rect x="284" y="116" width="70" height="10" rx="5" fill="#8fe8ff" opacity=".6"/>
    <rect x="236" y="148" width="328" height="564" rx="26" fill="url(#pb-case)"/>
