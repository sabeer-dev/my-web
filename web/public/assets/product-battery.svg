    <rect x="236" y="148" width="8" height="564" rx="4" fill="#8fe8ff" opacity=".35"/>

    <rect x="274" y="198" width="252" height="128" rx="14" fill="url(#pb-label)"/>
    <g fill="#0b3a86">
