<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Solar panels catching blue morning light">
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a5c"/>
      <stop offset=".55" stop-color="#092249"/>
      <stop offset="1" stop-color="#04122b"/>
    </linearGradient>
    <radialGradient id="cs-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8fe8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8fe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cs-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset=".4" stop-color="#0b3a86"/>
      <stop offset=".75" stop-color="#082a60"/>
      <stop offset="1" stop-color="#2d86ff"/>
    </linearGradient>
    <pattern id="cs-cells" width="48" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 0h48v34H0z" fill="none" stroke="#8fe8ff" stroke-opacity=".25" stroke-width="1.6"/>
      <path d="M24 0v34M0 17h48" stroke="#8fe8ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="cs-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f8ff" stop-opacity=".45"/>
      <stop offset=".4" stop-color="#e4f8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" fill="url(#cs-bg)"/>
  <circle cx="742" cy="118" r="210" fill="url(#cs-glow)"/>
  <circle cx="742" cy="118" r="38" fill="#e6fbff" opacity=".85"/>
  <g fill="#c9f4ff">
    <circle cx="120" cy="96" r="2" opacity=".5"/>
    <circle cx="236" cy="150" r="1.4" opacity=".4"/>
    <circle cx="678" cy="300" r="1.6" opacity=".4"/>
  </g>

  <g transform="translate(430 372) rotate(-7)">
    <rect x="-330" y="-156" width="660" height="312" rx="12" fill="#05122b"/>
    <rect x="-312" y="-138" width="624" height="276" rx="6" fill="url(#cs-glass)"/>
    <rect x="-312" y="-138" width="624" height="276" rx="6" fill="url(#cs-cells)"/>
    <path d="M-312-138H-96L-312 118Z" fill="url(#cs-glare)"/>
    <rect x="-330" y="-156" width="660" height="312" rx="12" fill="none" stroke="#4aa8ff" stroke-opacity=".5" stroke-width="3"/>
  </g>

  <g fill="#04122b" opacity=".9">
    <rect x="170" y="512" width="560" height="48"/>
  </g>
  <path d="M0 512h900v48H0z" fill="#020b1c" opacity=".55"/>
</svg>
