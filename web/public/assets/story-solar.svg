    <circle cx="272" cy="260" r="4" fill="#8fe8ff" opacity=".8"/>
  </g>

  <ellipse cx="430" cy="708" rx="420" ry="50" fill="url(#ss-warm)"/>

  <g fill="#04122b">
    <path d="M1040 660c-8-46 6-92 38-124-4 38-6 78-4 124Z"/>
    <path d="M1090 660c-2-40 12-76 40-102-8 32-12 66-10 102Z" opacity=".8"/>
    <path d="M86 660c-6-38 8-74 36-98-4 30-4 62-2 98Z" opacity=".85"/>
  </g>

  <g fill="none" stroke="#5cc8ff" stroke-opacity=".25" stroke-width="2">
