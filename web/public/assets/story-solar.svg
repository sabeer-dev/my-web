<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Modern home with rooftop solar panels at blue hour">
  <defs>
    <linearGradient id="ss-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020a1a"/>
      <stop offset=".42" stop-color="#061b3d"/>
      <stop offset=".74" stop-color="#0b3a7a"/>
      <stop offset="1" stop-color="#2d86ff"/>
    </linearGradient>
    <radialGradient id="ss-moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d7f8ff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#8fe8ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8fe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ss-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a39"/>
      <stop offset="1" stop-color="#020a1a"/>
    </linearGradient>
    <linearGradient id="ss-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset=".42" stop-color="#0b3a86"/>
      <stop offset="1" stop-color="#082a60"/>
    </linearGradient>
    <pattern id="ss-cells" width="44" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0h44v32H0z" fill="none" stroke="#8fe8ff" stroke-opacity=".24" stroke-width="1.5"/>
      <path d="M22 0v32M0 16h44" stroke="#8fe8ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="ss-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe8ff"/>
      <stop offset="1" stop-color="#2d86ff"/>
    </linearGradient>
    <radialGradient id="ss-warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#ss-sky)"/>
  <g fill="#e6fbff">
    <circle cx="120" cy="110" r="1.8" opacity=".6"/>
    <circle cx="260" cy="70" r="1.3" opacity=".45"/>
    <circle cx="420" cy="140" r="2" opacity=".55"/>
    <circle cx="600" cy="80" r="1.4" opacity=".4"/>
    <circle cx="780" cy="150" r="1.7" opacity=".5"/>
    <circle cx="960" cy="90" r="1.3" opacity=".45"/>
    <circle cx="1080" cy="170" r="1.8" opacity=".5"/>
    <circle cx="540" cy="200" r="1.2" opacity=".35"/>
  </g>

  <circle cx="900" cy="230" r="250" fill="url(#ss-moon)"/>
  <circle cx="900" cy="230" r="44" fill="#e6fbff" opacity=".9"/>

  <path d="M0 590 160 520 320 574 480 508 640 570 820 512 980 578 1140 520 1200 556V660H0Z" fill="#04122a" opacity=".85"/>
  <g fill="#5cc8ff" opacity=".4">
