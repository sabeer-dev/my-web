      <rect x="9" y="9" width="282" height="138" rx="3" fill="url(#ss-glass)"/>
      <rect x="9" y="9" width="282" height="138" rx="3" fill="url(#ss-cells)"/>
      <path d="M9 9h84L9 98Z" fill="#dff7ff" opacity=".18"/>
      <rect x="0" y="0" width="300" height="156" rx="7" fill="none" stroke="#4aa8ff" stroke-opacity=".45" stroke-width="2"/>
    </g>
    <g transform="translate(268 66) rotate(-24)" opacity=".9">
      <rect x="0" y="0" width="214" height="112" rx="6" fill="#05122b"/>
      <rect x="7" y="7" width="200" height="98" rx="3" fill="url(#ss-glass)"/>
      <rect x="7" y="7" width="200" height="98" rx="3" fill="url(#ss-cells)"/>
    </g>

    <g fill="url(#ss-window)">
