<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Monocrystalline solar panel in deep blue light">
  <defs>
    <radialGradient id="pp-bg" cx=".32" cy=".16" r=".95">
      <stop offset="0" stop-color="#1b62c4"/>
      <stop offset=".42" stop-color="#0b3272"/>
      <stop offset="1" stop-color="#04122b"/>
    </radialGradient>
    <linearGradient id="pp-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset=".32" stop-color="#12499e"/>
      <stop offset=".68" stop-color="#0a2a61"/>
      <stop offset="1" stop-color="#1f6fd1"/>
    </linearGradient>
    <pattern id="pp-cells" width="86" height="106" patternUnits="userSpaceOnUse">
      <path d="M0 0h86v106H0z" fill="none" stroke="#8fd6ff" stroke-opacity=".34" stroke-width="2"/>
      <path d="M43 0v106M0 53h86" stroke="#8fd6ff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <linearGradient id="pp-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f8ff" stop-opacity=".58"/>
      <stop offset=".4" stop-color="#e4f8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pp-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pp-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#020b1c" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#pp-bg)"/>
  <circle cx="620" cy="164" r="250" fill="url(#pp-glow)"/>
  <g fill="#c9f4ff">
    <circle cx="150" cy="150" r="2.6" opacity=".7"/>
    <circle cx="246" cy="96" r="1.8" opacity=".5"/>
    <circle cx="690" cy="318" r="2.2" opacity=".55"/>
    <circle cx="112" cy="336" r="1.7" opacity=".45"/>
    <circle cx="548" cy="82" r="1.5" opacity=".45"/>
    <circle cx="660" cy="514" r="1.8" opacity=".4"/>
  </g>
  <ellipse cx="400" cy="690" rx="270" ry="42" fill="#020b1c" opacity=".55"/>

  <g transform="translate(400 432) rotate(-9)" filter="url(#pp-shadow)">
    <rect x="-300" y="-200" width="600" height="400" rx="18" fill="#081b3c"/>
    <rect x="-300" y="-200" width="600" height="400" rx="18" fill="none" stroke="#4aa8ff" stroke-opacity=".75" stroke-width="4"/>
    <rect x="-280" y="-180" width="560" height="360" rx="8" fill="url(#pp-glass)"/>
    <rect x="-280" y="-180" width="560" height="360" rx="8" fill="url(#pp-cells)"/>
    <path d="M-280-180H-70L-280 60Z" fill="url(#pp-glare)"/>
    <rect x="-280" y="-180" width="560" height="360" rx="8" fill="none" stroke="#8fd6ff" stroke-opacity=".22" stroke-width="2"/>
    <g fill="#a8e4ff" opacity=".9">
      <rect x="-236" y="76" width="94" height="9" rx="4.5"/>
      <rect x="-236" y="98" width="146" height="6" rx="3" opacity=".5"/>
    </g>
    <circle cx="232" cy="88" r="10" fill="#8fe8ff" opacity=".85"/>
  </g>

  <path d="M244 676h312" stroke="#2d86ff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="676" r="4" fill="#8fe8ff"/>
</svg>
